<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldCubeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D478"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA822A"/>
    </linearGradient>
    <linearGradient id="flameGradDark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FF3E3E"/>
      <stop offset="100%" stop-color="#B81414"/>
    </linearGradient>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 3D Gold Gate Cube -->
  <g transform="translate(10, 10)">
    <!-- Left Face -->
    <path d="M 30 5 L 5 18 L 5 52 L 30 65 L 30 45 C 24 40 24 25 30 20 Z" fill="url(#goldCubeDark)" stroke="#8A6A20" stroke-width="1"/>
    <!-- Right Face -->
    <path d="M 30 5 L 55 18 L 55 52 L 30 65 L 30 45 C 36 40 36 25 30 20 Z" fill="url(#goldCubeDark)" stroke="#8A6A20" stroke-width="1"/>
    <!-- Top Face Facets -->
    <path d="M 30 5 L 5 18 L 30 25 L 55 18 Z" fill="#FFE59E" opacity="0.9"/>
    <!-- Inner Portal / Flame Altar -->
    <path d="M 24 35 C 24 22 30 18 30 18 C 30 18 36 22 36 35 C 36 44 30 50 30 50 C 30 50 24 44 24 35 Z" fill="url(#flameGradDark)" filter="url(#glowDark)"/>
    <path d="M 27 36 C 27 28 30 24 30 24 C 30 24 33 28 33 36 C 33 42 30 46 30 46 C 30 46 27 42 27 36 Z" fill="#FFF8E7"/>
  </g>

  <!-- Wordmark Typography -->
  <g transform="translate(82, 12)">
    <text x="0" y="16" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="3">THE</text>
    <text x="0" y="34" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="18" font-weight="900" fill="#E5C158" letter-spacing="1.5">CITYGATE</text>
    <text x="0" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="4">CHURCH</text>
  </g>
</svg>
