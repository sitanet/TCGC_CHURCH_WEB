{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Email Sent — {{ CHURCH_NAME }}{% endblock %}

{% block content %}
<section style="padding: var(--space-16) 0; min-height: calc(100vh - 280px); display: flex; align-items: center;">
  <div class="container" style="max-width: 460px;">
    <div class="card card-gold-accent text-center">
      <div class="empty-state-icon" style="margin-bottom: var(--space-4);">✉</div>
      <h2 style="font-family: var(--font-serif); font-size: var(--text-2xl); color: var(--color-slate-900); margin-bottom: var(--space-3);">Check Your Inbox</h2>
      <p style="font-size: var(--text-sm); color: var(--color-text-secondary); line-height: 1.6; margin-bottom: var(--space-6);">
        If an account exists with the email address you entered, we have sent instructions for resetting your password.
      </p>
      <a href="{% url 'accounts:login' %}" class="btn btn-primary">&larr; Return to Login</a>
    </div>
  </div>
</section>
{% endblock %}
