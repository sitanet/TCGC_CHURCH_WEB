{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password — {{ CHURCH_NAME }}{% endblock %}

{% block content %}
<section style="padding: var(--space-16) 0; min-height: calc(100vh - 280px); display: flex; align-items: center;">
  <div class="container" style="max-width: 440px;">
    <div class="card card-gold-accent">
      <div class="text-center" style="margin-bottom: var(--space-6);">
        <h2 style="font-family: var(--font-serif); font-size: var(--text-2xl); color: var(--color-slate-900);">Reset Password</h2>
        <p style="font-size: var(--text-sm); color: var(--color-text-secondary); margin-top: var(--space-2);">
          Enter your registered email address to receive password reset instructions.
        </p>
      </div>

      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-input" placeholder="name@thecitygatechurch.org" required autofocus>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Send Reset Link</button>
      </form>

      <div class="text-center" style="margin-top: var(--space-4);">
        <a href="{% url 'accounts:login' %}" style="font-size: var(--text-xs); color: var(--color-gold-600); font-weight: 600;">&larr; Back to Login</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
