{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete — {{ CHURCH_NAME }}{% endblock %}

{% block content %}
<section style="padding: var(--space-16) 0; min-height: calc(100vh - 280px); display: flex; align-items: center;">
  <div class="container" style="max-width: 460px;">
    <div class="card card-gold-accent text-center">
      <div class="empty-state-icon" style="margin-bottom: var(--space-4); color: var(--color-success); background-color: var(--color-success-bg);">✓</div>
      <h2 style="font-family: var(--font-serif); font-size: var(--text-2xl); color: var(--color-slate-900); margin-bottom: var(--space-3);">Password Reset Successful</h2>
      <p style="font-size: var(--text-sm); color: var(--color-text-secondary); line-height: 1.6; margin-bottom: var(--space-6);">
        Your new password has been set. You can now log into your account.
      </p>
      <a href="{% url 'accounts:login' %}" class="btn btn-primary">Sign In Now &rarr;</a>
    </div>
  </div>
</section>
{% endblock %}
