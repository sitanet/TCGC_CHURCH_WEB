{% if messages %}
  <div class="django-messages-bridge" style="display: none;">
    {% for message in messages %}
      <div class="django-flash-message" 
           data-message="{{ message|escapejs }}" 
           data-tag="{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}">
      </div>
    {% endfor %}
  </div>
{% endif %}
<div class="toast-container" aria-live="polite" aria-atomic="true"></div>
