{% load static %}
<!-- Global Search Overlay Modal -->
<div class="search-modal-backdrop" id="globalSearchModal" role="dialog" aria-modal="true" aria-label="Global Search">
  <div class="search-modal-box">
    <form method="get" action="{% url 'website:search' %}" class="search-input-header">
      <span style="font-size: 1.2rem; margin-right: var(--space-3); color: var(--color-gold-600);">🔍</span>
      <input type="text" name="q" id="globalSearchInput" class="search-input-field" placeholder="Search teachings, scriptures, events, journals, articles..." autocomplete="off" required>
      <button type="submit" class="btn btn-xs btn-primary" style="margin-right: var(--space-2);">Search</button>
      <button type="button" class="btn btn-xs btn-ghost" id="searchModalClose" style="color: var(--color-slate-400); font-size: 1.1rem;">&times;</button>
    </form>
    <div style="padding: var(--space-4) var(--space-6); background-color: #FFFFFF; display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: var(--color-text-muted);">
      <div>
        <span>Quick searches:</span>
        <a href="{% url 'website:search' %}?q=faith" style="color: var(--color-gold-600); margin-left: 6px;">#faith</a>
        <a href="{% url 'website:search' %}?q=grace" style="color: var(--color-gold-600); margin-left: 6px;">#grace</a>
        <a href="{% url 'website:search' %}?q=prayer" style="color: var(--color-gold-600); margin-left: 6px;">#prayer</a>
        <a href="{% url 'website:search' %}?q=dominion" style="color: var(--color-gold-600); margin-left: 6px;">#dominion</a>
      </div>
      <div style="font-family: var(--font-mono); font-size: 0.68rem;">
        Press <kbd style="background: var(--color-slate-100); padding: 2px 5px; border-radius: 3px; border: 1px solid var(--color-slate-300);">ESC</kbd> to close
      </div>
    </div>
  </div>
</div>
