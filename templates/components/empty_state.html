<div class="empty-state">
  <div class="empty-state-icon">
    {{ icon|default:"✧" }}
  </div>
  <h3 class="empty-state-title">{{ title|default:"No Records Found" }}</h3>
  <p class="empty-state-desc">{{ description|default:"There is currently no content available in this section." }}</p>
  {% if action_url %}
    <a href="{{ action_url }}" class="btn btn-sm btn-primary">{{ action_label|default:"Add New" }}</a>
  {% endif %}
</div>
