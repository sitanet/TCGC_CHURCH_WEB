{% extends 'base.html' %}
{% load static %}

{% block title %}Page Not Found (404) — {{ CHURCH_NAME }}{% endblock %}

{% block content %}
<section style="padding: var(--space-20) 0; text-align: center; min-height: calc(100vh - 280px); display: flex; align-items: center;">
  <div class="container" style="max-width: 580px;">
    <span class="section-eyebrow">404 Error</span>
    <h1 class="display-title" style="margin-bottom: var(--space-4);">Page Not Found</h1>
    <p class="lead-text" style="margin-bottom: var(--space-8);">
      The resource or page you are looking for may have been moved, updated, or is no longer available.
    </p>
    <div style="display: flex; justify-content: center; gap: var(--space-4);">
      <a href="{% url 'website:home' %}" class="btn btn-primary">Return Home</a>
      <a href="{% url 'website:contact' %}" class="btn btn-outline">Contact Us</a>
    </div>
  </div>
</section>
{% endblock %}
