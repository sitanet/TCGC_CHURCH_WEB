<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ youtube_live_info.video_title|default:"The CityGate Church Live Stream" }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #000000;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <iframe
            id="tcgc-live-video"
            src="{{ youtube_live_info.embed_url }}"
            title="{{ youtube_live_info.video_title|default:'The CityGate Church Live Stream' }}"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>
    </div>
</body>
</html>
