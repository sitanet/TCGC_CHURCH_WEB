# ==============================================================================
# THE CITYGATE CHURCH — NGINX PRODUCTION CONFIGURATION
# Domain: thecitygatechurch.org & www.thecitygatechurch.org
# Reverse Proxy to Gunicorn with Static & Media Direct Serving
# ==============================================================================

upstream citygate_app {
    server unix:/run/gunicorn.sock fail_timeout=0;
    # Fallback if using TCP:
    # server 127.0.0.1:8000 fail_timeout=0;
}

# 1. HTTP -> HTTPS Permanent Redirect (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name thecitygatechurch.org www.thecitygatechurch.org;

    # Let's Encrypt ACME Challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Main Server (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thecitygatechurch.org www.thecitygatechurch.org;

    # SSL / Let's Encrypt Certificate Paths
    ssl_certificate /etc/letsencrypt/live/thecitygatechurch.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thecitygatechurch.org/privkey.pem;

    # Modern TLS Security Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum file upload size (matches video upload ceiling of 500MB)
    client_max_body_size 500M;

    # Proxy Timeouts for Large Audio/Video Uploads
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # Access and Error Logs
    access_log /var/log/nginx/citygate_access.log;
    error_log /var/log/nginx/citygate_error.log;

    # Static Assets Direct Serving
    location /static/ {
        alias /var/www/thecitygatechurch/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Media Uploads Direct Serving (if local storage is used)
    location /media/ {
        alias /var/www/thecitygatechurch/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Favicon & Robots shortcut
    location = /favicon.ico {
        alias /var/www/thecitygatechurch/staticfiles/img/favicon.png;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        proxy_pass http://citygate_app;
        access_log off;
    }

    # Reverse Proxy to Gunicorn WSGI Application
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://citygate_app;
    }
}
